services:
  db:
    image: postgres:16-alpine
    container_name: app-starter-db
    environment:
      POSTGRES_USER: pf
      POSTGRES_PASSWORD: pf
      POSTGRES_DB: app_starter
    ports:
      - "5433:5432"
    volumes:
      - app_starter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf -d app_starter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_starter_pgdata:
